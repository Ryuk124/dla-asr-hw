defaults:
  - lm_rescored
  - override /model: conformer_big
  - override /datasets: librispeech_eval
  - _self_

model:
  blocks_amount: 16

dataloader:
  batch_size: 16
  num_workers: 4

inferencer:
  device_tensors: [spectrogram, text_encoded]
  device: auto
  save_path: data/saved/conformer_16blocks_rescored
  seed: 1
  from_pretrained: saved/conformer_16blocks_90ep_01/model_best.pth
  decoding:
    method: rescore
    beam_size: 1000
    token_top_k: null
    nbest_size: 100
text_encoder:
  rescorer:
    device: ${inferencer.device}
