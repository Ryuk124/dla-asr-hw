defaults:
- inference_bpe
- _self_
text_encoder:
  use_lm: true
  lm_path: /storage/lam-tts-resources-2/experiments/VTTS-4688/librispeech_lm/4-gram.arpa
  lm_alpha: 0.8
  lm_beta: 1.0
  beam_prune_logp: -12.0
  token_min_logp: -7.0
  rescorer:
    _target_: src.text_encoder.lm_rescorer.NBestRescorer
    model_dir: /storage/k-stakheev-devbox/llm_spec/259_asr_nbest_rescoring/transformer_lm
    neural_weight: 0.8
    ngram_weight: 0.0
    word_bonus: 1.25
    batch_size: 64
    device: cuda
metrics:
  train: []
  inference:
  - _target_: src.metrics.ArgmaxCERMetric
    name: CER_(Argmax)
  - _target_: src.metrics.ArgmaxWERMetric
    name: WER_(Argmax)
  - _target_: src.metrics.cer.BeamSearchCERMetric
    name: CER_(Rescore)
    beam_size: 1000
    nbest_size: 100
    rescore: true
  - _target_: src.metrics.wer.BeamSearchWERMetric
    name: WER_(Rescore)
    beam_size: 1000
    nbest_size: 100
    rescore: true
inferencer:
  save_path: conformer_bpe1024_rescored
