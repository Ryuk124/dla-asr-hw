train:
  get_spectrogram: # special key for getting spectrogram
    _target_: src.transforms.LogMelSpectrogram
    sample_rate: 16000
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.SpeedPerturbationAug
        orig_freq: 16000
        factors: [0.9, 1.0, 1.1]

      - _target_: src.transforms.wav_augs.Gain
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.5
        sample_rate: 16000
        output_type: tensor

      - _target_: src.transforms.wav_augs.AddColoredNoise
        min_snr_in_db: 20.0
        max_snr_in_db: 30.0
        p: 0.3
        sample_rate: 16000
        output_type: tensor
  spectrogram:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.spec_augs.FrequencyMasking
        freq_mask_param: 15
        iid_masks: True
      - _target_: src.transforms.spec_augs.TimeMasking
        time_mask_param: 30
        iid_masks: True
        p: 0.1
inference:
  get_spectrogram:
    _target_: src.transforms.LogMelSpectrogram
    sample_rate: 16000
