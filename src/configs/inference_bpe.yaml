defaults:
  - bpe
  - override /datasets: librispeech_eval
  - _self_

inferencer:
  device_tensors: [spectrogram, text_encoded]
  device: auto
  save_path: data/saved/conformer_bpe1024
  seed: 1
  from_pretrained: saved/conformer_bpe1024_960h_01/model_best.pth
  decoding:
    method: greedy
    beam_size: 1000
    token_top_k: null
    nbest_size: 100
