[project]
name = "dla-asr-hw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "k.stakheev", email = "k.stakheev@tbank.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.7",
    "numpy>=2.5.4",
    "omegaconf>=2.3.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[project.scripts]
dla-asr-hw = "dla_asr_hw:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
