[project]
name = "dla-asr-hw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "k.stakheev", email = "k.stakheev@tbank.ru" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "comet-ml>=3.58.8",
    "datasets>=5.1.0",
    "editdistance>=0.8.1",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "omegaconf>=2.3.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pip-system-certs>=5.3",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torch-audiomentations>=0.12.0",
    "torchao>=0.18.0",
    "torchaudio>=2.11.0",
    "torchtune>=0.6.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "wget>=3.2",
]

[project.scripts]
dla-asr-hw = "dla_asr_hw:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.uv]
package = false
